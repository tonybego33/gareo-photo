<!DOCTYPE html>
<html lang="fr">
<head>

<style>
:root{--navy:#1d3a5f;--ink:#16202b;--mute:#6b7682;--line:#d9dee4;--bg:#f4f5f7;--card:#fff;--yel:#f4c542;--red:#c8442f;--grn:#2f8a57;--org:#d9822b;--blue:#2c6db5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
header .brand{font-weight:700;letter-spacing:.02em;margin-right:auto}
header .brand small{font-weight:400;opacity:.7;margin-left:6px}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 11px;font-size:13px}
.tabs button.on{background:var(--yel);color:var(--ink);border-color:var(--yel);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:10px 10px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:44px;text-align:center}
.btn.big{min-height:62px;font-size:16px;font-weight:600}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.yel{background:var(--yel);border-color:var(--yel);font-weight:600}
.btn.red{background:#fff;color:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13.5px;min-height:36px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.att.on{background:var(--grn);border-color:var(--grn)}
.chip.agg.on{background:var(--red);border-color:var(--red)}
.chip.eva.on{background:var(--org);border-color:var(--org)}
.chip.star.on{background:var(--yel);color:var(--ink);border-color:var(--yel)}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-height:44px}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
/* Contexte courant */
.ctx{position:sticky;top:52px;z-index:10;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ctx .niv{display:inline-block;background:var(--yel);color:var(--ink);font-weight:700;border-radius:6px;padding:1px 7px;font-size:12.5px;margin-right:6px}
.ctx .zone{font-size:19px;font-weight:700;margin:4px 0 2px}
.ctx .eq{font-size:15px}
.ctx .eq.gen{opacity:.7;font-style:italic}
.ctx .meta{font-size:12px;opacity:.75;margin-top:4px}
.ctx .tags span{display:inline-block;background:rgba(255,255,255,.16);border-radius:5px;padding:1px 6px;margin:3px 4px 0 0;font-size:12px}
.journal .ev{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.journal .ev:first-child{border-top:0}
.journal .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:64px}
.journal .ev .x{margin-left:auto;display:flex;gap:4px}
.journal .ev .x button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;font-size:12px}
.banner{background:#fff7dd;border:1px solid #f0d98a;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px}
.banner.ok{background:#e8f5ec;border-color:#b8dec5}
.banner.err{background:#fde9e5;border-color:#f2b7ab}
/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.ov .top b{margin-right:auto;font-size:16px}
.ov .top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 12px}
.ov .body{flex:1;overflow:auto;padding:10px}
.ov .foot{padding:10px;display:flex;gap:8px;background:#fff;border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.ov .foot .btn{flex:1}
.nivtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nivtabs button{flex:0 0 auto}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.zlist .btn{text-align:left;font-size:14px;min-height:52px;line-height:1.2}
.zlist .btn small{display:block;color:var(--mute);font-size:11.5px}
.eqlist .btn{display:flex;width:100%;text-align:left;margin-bottom:5px;align-items:center;gap:8px}
.eqlist .btn .nm{flex:1}
.imp{font-size:11px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap}
.imp4{background:#fbe1dc;color:#a8321f}.imp3{background:#fdebd7;color:#a5591a}.imp2{background:#eef0d6;color:#6a6a1d}.imp1{background:#eef1f4;color:#55606b}
.planwrap{position:relative;overflow:auto;flex:1;background:#fff;touch-action:pan-x pan-y}
.planwrap img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:22px;height:22px;margin:-22px 0 0 -11px;pointer-events:none}
.pin::before{content:"";position:absolute;left:3px;top:0;width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--red);transform:rotate(-45deg);box-shadow:0 0 0 2px #fff}
.dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--blue);opacity:.65;pointer-events:none;box-shadow:0 0 0 1px #fff}
.ver{position:fixed;right:6px;bottom:4px;font-size:10.5px;color:var(--mute);z-index:5;background:rgba(244,245,247,.85);padding:1px 5px;border-radius:4px}
/* Bureau */
.seg{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden}
.seg>.hd{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;background:#f8f9fb;border-bottom:1px solid var(--line)}
.seg>.hd .tm{font-variant-numeric:tabular-nums;font-weight:700;min-width:96px}
.seg>.hd .lb{flex:1}
.seg>.hd .lb b{font-size:15px}
.seg .ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;padding:10px}
.ph .it{position:relative;border:2px solid transparent;border-radius:9px;overflow:hidden;background:#eef0f3;cursor:pointer}
.ph .it.sel{border-color:var(--blue)}
.ph .it.moved{box-shadow:0 0 0 2px var(--org) inset}
.ph .it img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#dde2e8}
.ph .it .vid{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;font-size:34px;background:#2a3440;color:#fff}
.ph .it .cap{font-size:11px;padding:3px 5px;display:flex;justify-content:space-between;gap:4px;background:#fff}
.ph .it .ck{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,.9);border:1px solid #889;display:flex;align-items:center;justify-content:center;font-size:13px}
.ph .it.sel .ck{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar{position:sticky;top:52px;z-index:9;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px;margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.toolbar .btn{min-height:36px;padding:6px 10px;font-size:13.5px;color:var(--ink)}
.toolbar .btn:disabled{opacity:.35}
.toolbar select{color:var(--ink)}
.toolbar select{width:auto;min-height:36px;max-width:340px}
.stat{display:inline-block;margin-right:14px}
.stat b{font-size:18px}
.prog{height:8px;background:#e3e7ec;border-radius:9px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;background:var(--navy);width:0}
.help h3{margin-top:16px}
.help li{margin:4px 0}
@media (min-width:900px){.ctx{top:56px}.toolbar{top:56px}}
</style>
</head>

const $ = (s, r=document) => r.querySelector(s);

const pad = (n, l=2) => String(n).padStart(l, '0');
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const hms = t => { const d = new Date(t); return hm(t) + ':' + pad(d.getSeconds()); };
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const ascii = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[œŒ]/g, 'oe').replace(/[æÆ]/g, 'ae')
  .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const short = (s, n) => ascii(s).slice(0, n).replace(/-+$/, '');
const nivOf = id => NIVEAUX.find(n => n.id === id) || {id, label:id, plan:null, zones:[]};
const eqInfo = n => EQUIP.find(e => e.n === n);
const maxImp = e => e ? Math.max(...e.l) : -1;
const impBadge = e => { if (!e) return ''; const m = maxImp(e); const nTE = e.l.filter(x => x === 4).length;
  const lab = m === 4 ? 'TE' + (nTE > 1 ? '×' + nTE : '') : m === 3 ? 'É' : m === 2 ? 'M' : 'F';
  return `<span class="imp imp${Math.max(1,m)}" title="Niveau d'impact max dans la matrice G&C">${lab}</span>`; };
function toast(msg, kind='') { const b = document.createElement('div'); b.className = 'banner ' + kind;

function download(name, data, type='application/json') {
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function startVisite(gare, code, auteur) {
  const id = uid(), t = Date.now();
  S.visites[id] = {id, gare, code: ascii(code).toUpperCase() || 'GARE', auteur, debut:t, fin:null, lastBackup:null,
    events:[{id:uid(), k:'debut', t}]};

}
function pushCtx(patch) {
  const v = V(); if (!v) return;
  const c = cur() || {niv:'N0', zone:'(zone non définie)', eq:'', al:[], ef:'', star:false, note:'', pt:null};
  const ev = Object.assign({niv:c.niv, zone:c.zone, eq:c.eq, al:[], ef:'', star:false, note:'', pt:c.pt}, patch,
    {id:uid(), k:'ctx', t:Date.now(), gps:null});
  v.events.push(ev); save(); render(); grabGps(ev.id);
}
function editCur(patch) { const c = cur(); if (!c) return; Object.assign(c, patch, {mod:Date.now()}); save(); render(); }
function setZone(niv, zone, pt) { pushCtx({niv, zone, eq:'', pt: pt || null}); }
function setEq(eq) {
  if (eq) { S.recentEq = [eq, ...S.recentEq.filter(x => x !== eq)].slice(0, 8); }
  pushCtx({eq});
}
function grabGps(evId) {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => {
    const v = V(); if (!v) return; const ev = v.events.find(e => e.id === evId); if (!ev) return;
    ev.gps = {lat:+p.coords.latitude.toFixed(6), lon:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}; save();
    const ae = document.activeElement;
    if (UI.mode === 'terrain' && !UI.ov && !(ae && /INPUT|TEXTAREA/.test(ae.tagName))) render();
  }, () => {}, {enableHighAccuracy:true, timeout:8000, maximumAge:20000});
}
function antidate(sec) {
  const v = V(); const c = cur(); if (!c) return;
  const prev = v.events.filter(e => e.t < c.t && e.id !== c.id).pop();
  const min = prev ? prev.t + 1000 : c.t - sec * 1000;
  c.t = Math.max(min, c.t - sec * 1000); save(); render(); toast('Repère avancé à ' + hms(c.t));
}
function delEvent(id) {
  const v = V(); const e = v.events.find(x => x.id === id); if (!e) return;
  if (!confirm('Supprimer le repère de ' + hms(e.t) + ' ?\n(les photos seront rattachées au repère précédent)')) return;
  v.events = v.events.filter(x => x.id !== id); save(); render();
}
function journalPayload(v) {

function backupJournal(v = V()) { if (!v) return; download(journalName(v), JSON.stringify(journalPayload(v), null, 1));
  v.lastBackup = Date.now(); save(); render(); }
async function shareJournal(v = V()) {
  if (!v) return; const f = new File([JSON.stringify(journalPayload(v), null, 1)], journalName(v), {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[f]})) {
    try { await navigator.share({files:[f], title:'Journal de visite ' + v.gare}); v.lastBackup = Date.now(); save(); render(); } catch (e) {}

/* ---------- Lecture des métadonnées ---------- */
async function addMedia(files) {
  const list = [...files].filter(f => /^(image|video)\//.test(f.type) || /\.(jpe?g|heic|heif|png|mp4|mov|3gp)$/i.test(f.name));
  B.loading = {done:0, total:list.length}; render();
  const known = new Set(B.media.map(m => m.key));
  for (const f of list) {
    const key = f.name + '|' + f.size + '|' + f.lastModified;
    if (!known.has(key)) {
      try { B.media.push(await readMeta(f, key)); } catch (e) { console.warn(f.name, e); }
      known.add(key);
    }
    B.loading.done++;
    if (B.loading.done % 25 === 0) render();
  }
  B.loading = null; render();
}
async function readMeta(f, key) {
  const isVid = /^video\//.test(f.type) || /\.(mp4|mov|3gp)$/i.test(f.name);
  const m = {key, file:f, name:f.name, type:isVid ? 'video' : 'photo', t:null, src:'', gps:null, thumb:null,
    url() { return this._u || (this._u = URL.createObjectURL(this.file)); }};
  if (!isVid && /\.(jpe?g)$/i.test(f.name) || f.type === 'image/jpeg') {
    const ex = parseExif(await f.slice(0, 262144).arrayBuffer());
    if (ex) {
      if (ex.dto) { m.t = exifTime(ex.dto, ex.off); m.src = ex.off ? 'EXIF+fuseau' : 'EXIF'; }
      if (ex.gps) m.gps = ex.gps;

    }
  }
  if (isVid && !m.t) {
    const t = await mp4Time(f); if (t) { m.t = t; m.src = 'vidéo (mvhd)'; }
  }
  if (!m.t) { const fm = f.name.match(/(20\d\d)(\d\d)(\d\d)[_\-]?(\d\d)(\d\d)(\d\d)/);
    if (fm) { m.t = new Date(+fm[1], +fm[2] - 1, +fm[3], +fm[4], +fm[5], +fm[6]).getTime(); m.src = 'nom de fichier'; } }

}
function exifTime(dto, off) {

    case 'star': editCur({star: !cur().star}); break;
    case 'note': editCur({note: $('#iNote').value.trim()}); toast('Note enregistrée'); break;
    case 'anti': antidate(+el.dataset.v); break;
    case 'del': delEvent(el.dataset.id); break;
    case 'backup': backupJournal(); break;
    case 'share': shareJournal(); break;
    case 'end': endVisite(); break;
    // Bureau
    case 'pickJournal': $('#fJournal').click(); break;
    case 'jLocal': { const o = S.visites[el.dataset.id]; B.journal = JSON.parse(JSON.stringify(journalPayload(o))); B.override = {}; render(); break; }
    case 'jReset': B.journal = null; B.override = {}; B.sel.clear(); render(); break;
    case 'pickMedia': $('#fMedia').click(); break;
    case 'pickDir': $('#fDir').click(); break;
    case 'mReset': B.media = []; B.sel.clear(); B.override = {}; B.exportLog = null; render(); break;
    case 'sel': { const k = el.dataset.k; B.sel.has(k) ? B.sel.delete(k) : B.sel.add(k); el.classList.toggle('sel'); el.querySelector('.ck').textContent = B.sel.has(k) ? '✓' : '';
      refreshToolbar(); break; }
    case 'selSeg': { const si = +el.dataset.v; B.last.items.filter(m => m.si === si).forEach(m => B.sel.add(m.key)); render(); break; }
    case 'selNone': B.sel.clear(); render(); break;
    case 'mvPrev': moveSel(si => si - 1); break;
    case 'mvNext': moveSel(si => si + 1); break;
    case 'mvReset': moveSel(() => null); break;
    case 'editSeg': editSeg(+el.dataset.v); break;
    case 'export': try { await doExport(); } catch (e) { console.error(e); B.exportLog = {err:true, html:'Erreur pendant l\'export : ' + esc(e.message)}; render(); } break;
    case 'csvOnly': { const R = assign(); download(B.journal.visite.code + '_inventaire_photos.csv', csv(R.items.map(m => { const s = R.segs[m.si];
      return {n:m.seq, origine:m.name, type:m.type, date:ymd(m.tc), heure:hms(m.tc), source_heure:m.src, niveau:s ? nivOf(s.niv).label : '', zone:s ? s.zone : '', equipement:s ? s.eq : '',
        aleas:s ? s.al.join(', ') : '', effet:s ? s.ef : '', important:s && s.star ? 'oui' : '', note:s ? s.note : '', lat:m.gps ? m.gps.lat : '', lon:m.gps ? m.gps.lon : ''}; })), 'text/csv'); break; }
  }
});
function refreshToolbar() { const n = B.sel.size; const t = $('.toolbar'); if (!t) return; $('#selN').textContent = n + ' sélect.';
  t.querySelectorAll('[data-act=mvPrev],[data-act=mvNext],[data-act=mvReset],[data-act=selNone],#sMove').forEach(b => b.disabled = !n); }
document.addEventListener('input', ev => {
  if (ev.target.id === 'iEqQ') { UI.eqQ = ev.target.value; $('#eqRes').innerHTML = eqResults(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'iOffset') { B.offset = +t.value || 0; render(); }
  if (t.id === 'iMarge') { B.marge = Math.max(0, +t.value || 0); render(); }
  if (t.id === 'cHors') { B.horsVisite = t.checked; render(); }
  if (t.id === 'sMove' && t.value !== '') { const to = +t.value; moveSel(() => to); }
  if (t.id === 'fJournal' && t.files[0]) { t.files[0].text().then(txt => { try { const j = JSON.parse(txt); if (!j.events || !j.visite) throw 0; B.journal = j; B.override = {}; render(); }
    catch (e) { alert('Ce fichier n\'est pas un journal GARÉo Photo.'); } t.value = ''; }); }
  if ((t.id === 'fMedia' || t.id === 'fDir') && t.files.length) { addMedia(t.files).then(() => { t.value = ''; }); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'iNote') { editCur({note: ev.target.value.trim()}); toast('Note enregistrée'); }
  if (ev.key === 'Enter' && ev.target.id === 'iNewZone') $('[data-act=newZone]').click(); });
setInterval(() => { const c = cur(); const s = $('#since'); if (c && s) s.textContent = fmtSince(Math.floor((Date.now() - c.t) / 1000)); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && UI.mode === 'terrain' && !UI.ov) { S = load(); render(); } });
window.addEventListener('beforeunload', e => { if (B.media.length && UI.mode === 'bureau') { e.preventDefault(); e.returnValue = ''; } });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
