<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<title>GARÉo Photo</title>

<link rel="apple-touch-icon" href="gareo-apple-180.png">
<style>
:root{--navy:#1A1A1A;--ink:#1A1A1A;--mute:#8B8680;--line:#D9D3C4;--bg:#F5F2EB;--yel:#C8102E;--red:#C8102E;--grn:#1D5E3A;--org:#C77800;--blue:#2C7E9C;--paper:#FAF8F3;--tint:#FBEAEC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#1A1A1A;color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
header .brand{font-weight:700;margin-right:auto;display:flex;align-items:center;gap:7px}
header .glogo{height:30px;width:auto;display:block}
header .bsub{font-weight:600;font-size:15px;opacity:.9}
@media (max-width:460px){header .bsub,#hdrGare{display:none}.tabs button{padding:5px 8px;font-size:12.5px}header .glogo{height:26px}}
header .brand small{font-weight:400;opacity:.7;margin-left:6px}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 11px;font-size:13px}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:10px 10px 90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:15px;margin:4px 0 8px}
.mute{color:var(--mute)}.small{font-size:12.5px}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;min-height:44px;text-align:center;color:var(--ink)}
.btn.big{min-height:64px;font-size:16px;font-weight:600}
.btn.huge{min-height:96px;font-size:20px;font-weight:700}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.yel{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.btn.red{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13.5px;min-height:36px;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.att.on{background:var(--grn);border-color:var(--grn)}.chip.agg.on{background:var(--red);border-color:var(--red)}.chip.eva.on{background:var(--org);border-color:var(--org)}
.chip.star.on{background:var(--org);color:#fff;border-color:var(--org)}
.chip.sel{background:var(--tint);border-color:var(--red);color:var(--ink);font-weight:600}
.chip .x{font-weight:700;opacity:.6;margin-left:2px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.banner{background:#FAEFD9;border:1px solid #E8D3A8;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px}
.banner.ok{background:#e8f5ec;border-color:#b8dec5}.banner.err{background:#fde9e5;border-color:#f2b7ab}
.imp{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap}
.imp4{background:#fbe1dc;color:#a8321f}.imp3{background:#fdebd7;color:#a5591a}.imp2{background:#eef0d6;color:#6a6a1d}.imp1{background:#eef1f4;color:#55606b}
/* galerie */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.gal .it{position:relative;border-radius:9px;overflow:hidden;background:#dde2e8;border:2px solid transparent;cursor:pointer}
.gal .it img,.gal .it .ph0{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gal .it .ph0{display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:#2a3440}
.gal .it .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10.5px;padding:12px 5px 4px;line-height:1.15}
.gal .it .bd{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;border-radius:5px;padding:1px 5px}
.gal .it .todo{position:absolute;top:4px;right:4px;background:var(--org);color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px}
.gal .it.sel{border-color:var(--red)}
/* overlay fiche */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .top{background:#1A1A1A;color:#fff;display:flex;align-items:center;gap:8px;padding:9px 10px;padding-top:calc(9px + env(safe-area-inset-top))}
.ov .top b{margin-right:auto;font-size:15px;font-weight:800}
.ov .top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 11px}
.ov .body{flex:1;overflow:auto;padding:10px}
.ov .foot{padding:9px 10px;display:flex;gap:8px;background:#fff;border-top:1px solid var(--line);padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.ov .foot .btn{flex:1}
.prev{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.prev img,.prev .ph0{width:112px;height:84px;object-fit:cover;border-radius:9px;background:#dde2e8;flex:0 0 auto}
.prev .ph0{display:flex;align-items:center;justify-content:center;font-size:30px;background:#2a3440;color:#fff}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.nivtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nivtabs .chip{flex:0 0 auto}
.planbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.planwrap{position:relative;overflow:auto;height:40vh;min-height:230px;background:#fff}
.planwrap img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pctl{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);background:#f8f9fb;align-items:center;flex-wrap:wrap}
.pctl .chip{min-height:34px;padding:5px 10px}
.pin{position:absolute;width:0;height:0;pointer-events:none}
.pin i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #fff,0 1px 6px rgba(0,0,0,.5)}
.pin b{position:absolute;left:0;top:-2px;width:46px;height:4px;background:var(--red);transform-origin:0 50%;border-radius:2px;box-shadow:0 0 0 1px #fff}
.pin b::after{content:"";position:absolute;right:-6px;top:-5px;border-left:10px solid var(--red);border-top:7px solid transparent;border-bottom:7px solid transparent}
.dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--blue);opacity:.55;pointer-events:none;box-shadow:0 0 0 1px #fff}
.full{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center}
.full img,.full video{max-width:100%;max-height:100%}
.full button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:9px 13px}
.ver{position:fixed;right:6px;bottom:4px;font-size:10.5px;color:var(--mute);z-index:5;background:rgba(245,242,235,.9);padding:1px 5px;border-radius:4px}
.stat{display:inline-block;margin-right:14px}.stat b{font-size:18px}
.prog{height:8px;background:#e3e7ec;border-radius:9px;overflow:hidden;margin-top:6px}.prog>div{height:100%;background:var(--navy);width:0}
.lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.chip.alc.on{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);border-color:var(--c);font-weight:800}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg3 button{border:0;border-right:1px solid var(--line);background:#fff;padding:10px 4px;min-height:48px;font-weight:700;font-size:14px;color:var(--ink)}
.seg3 button:last-child{border-right:0}.seg3 .agg b{color:#C8102E}.seg3 .att b{color:#1D5E3A}.seg3 .eva b{color:#C77800}
.seg3 .agg.on{background:#C8102E;color:#fff}.seg3 .att.on{background:#1D5E3A;color:#fff}.seg3 .eva.on{background:#C77800;color:#fff}.seg3 .on b{color:#fff}
.srch{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:0 8px}
.srch span{font-size:17px}.srch input{border:0 !important;min-height:46px;font-size:16px;padding:8px 2px;background:transparent;outline:none}
.zgrp{margin-bottom:12px}.zgrp h3{margin:10px 0 6px}
.help li{margin:4px 0}
</style>
</head>

<main id="app"></main>
<div id="ov"></div>
<div class="ver" id="ver"></div>
<input type="file" id="capP" accept="image/*" capture="environment" hidden>
<input type="file" id="capV" accept="video/*" capture="environment" hidden>
<input type="file" id="imp" accept="image/*,video/*" multiple hidden>

<input type="file" id="fMedia" accept="image/*,video/*" multiple hidden>
<input type="file" id="fDir" webkitdirectory multiple hidden>

const DB = {
  _db:null,
  open() { if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => { const r = indexedDB.open('gareoPhoto', 2);
      r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs'); if (!d.objectStoreNames.contains('snaps')) d.createObjectStore('snaps'); };
      r.onsuccess = () => { this._db = r.result; res(this._db); }; r.onerror = () => rej(r.error); }); },
  async tx(store, mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store);
    let out; const q = fn(s); if (q) q.onsuccess = () => { out = q.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
};

async function makeThumb(blob, isVid) {
  try {
    let src;
    if (isVid) src = await videoFrame(blob); else src = await createImageBitmap(blob, {resizeWidth:420, resizeQuality:'medium'});
    if (!src) return null;
    const w = isVid ? 420 : src.width, h = isVid ? Math.round(420 * src.videoHeight / src.videoWidth) || 315 : src.height;
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(src, 0, 0, w, h);
    if (src.close) src.close(); if (isVid && src._u) URL.revokeObjectURL(src._u);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
  } catch (e) { return null; }
}
function videoFrame(blob) { return new Promise(res => { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
  const u = URL.createObjectURL(blob); v._u = u; let done = false; const fin = x => { if (!done) { done = true; res(x); } };
  setTimeout(() => fin(null), 4000); v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { fin(null); } };

/* Avant la v8, deux visites du même téléphone avaient les mêmes n° (PAZ_0001…) : la fiche ouverte
   pouvait être celle de l'autre visite et le fichier était écrasé par la dernière prise.
   Réparation : chaque modification faite APRÈS la prise d'une photo plus récente de même n° lui revient. */
function repairCollisions() {
  if (S.repairV8) return 0;
  const byId = {}; Object.values(S.visites).forEach(v => v.photos.forEach(p => { if (!p.bk) (byId[p.id] = byId[p.id] || []).push(p); }));
  const dup = Object.values(byId).filter(l => l.length > 1);
  if (dup.length) { try { localStorage.setItem(STORE_KEY + '.avant-reparation', JSON.stringify(S)); } catch (e) {} }
  let fixed = 0; const F = ['niv', 'zone', 'pt', 'eqs', 'al', 'ef', 'star', 'note'];
  for (const l of dup) {
    l.sort((a, b) => a.t - b.t); const newest = l[l.length - 1];
    for (const q of l.slice(0, -1)) {
      const p = q.mod ? l.filter(x => x.t > q.t && x.t < q.mod).pop() : null;   /* la photo la plus récente prise avant la modification */
      if (p && (!p.mod || q.mod > p.mod)) { F.forEach(k => p[k] = JSON.parse(JSON.stringify(q[k] ?? null)) ?? (k === 'eqs' || k === 'al' ? [] : k === 'star' ? false : '')); p.mod = q.mod; delete q.mod; fixed++; }
      q.bk = q.id + '#ecrase'; q.stored = false;   /* son fichier a été remplacé par la photo plus récente */
    }
    newest.bk = newest.id;
  }
  S.repairV8 = {at:Date.now(), fixed, dup:dup.length}; save(); return fixed;
}

const CSV_COLS = ['n', 'id', 'fichier', 'dossier', 'origine', 'type', 'date', 'heure', 'niveau', 'zone', 'equipements', 'nb_equipements', 'aleas', 'effet', 'important', 'note',

    niveau:nivOf(p.niv).label, niv:p.niv, zone:p.zone, equipements:p.eqs.join(' | '), nb_equipements:p.eqs.length, aleas:p.al.map(alLabel).join(', '), effet:p.ef ? efLabel(p.ef) : '',
    important:p.star ? 'oui' : '', note:p.note, plan:p.pt ? p.pt.n : '', plan_x:p.pt ? p.pt.x : '', plan_y:p.pt ? p.pt.y : '', direction_deg:p.pt && p.pt.dir != null ? p.pt.dir : '',
    lat:gps ? gps.lat : '', lon:gps ? gps.lon : '', gps_precision_m:!p.exGps && p.gps ? p.gps.acc : '', gps_source:p.exGps ? 'photo' : (p.gps ? 'navigateur' : '')}; }
function csv(rows) { const q = x => { const s = String(x ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };

/* ---------- Lecture EXIF / vidéo ---------- */
function exifTime(dto, off) {
  const p = dto.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/); if (!p) return null;
  if (off && /^[+-]\d\d:\d\d$/.test(off)) return Date.parse(`${p[1]}-${p[2]}-${p[3]}T${p[4]}:${p[5]}:${p[6]}${off}`);
  return new Date(+p[1], +p[2] - 1, +p[3], +p[4], +p[5], +p[6]).getTime();
}
function parseExif(buf) {
  const dv = new DataView(buf); if (dv.byteLength < 4 || dv.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while (o + 4 < dv.byteLength) {
    if (dv.getUint8(o) !== 0xFF) return null;
    const mk = dv.getUint8(o + 1), len = dv.getUint16(o + 2);
    if (mk === 0xE1 && dv.getUint32(o + 4) === 0x45786966) return parseTiff(dv, o + 10, Math.min(dv.byteLength, o + 2 + len));
    if (mk === 0xDA) return null;
    o += 2 + len;
  }
  return null;
}
function parseTiff(dv, T, end) {
  const le = dv.getUint16(T) === 0x4949;
  const u16 = p => dv.getUint16(p, le), u32 = p => dv.getUint32(p, le);
  const ascii_ = (p, n) => { let s = ''; for (let i = 0; i < n && p + i < end; i++) { const c = dv.getUint8(p + i); if (!c) break; s += String.fromCharCode(c); } return s; };
  const readIfd = p => { const out = {}; if (p + 2 > end) return {out, next:0}; const n = u16(p);
    for (let i = 0; i < n; i++) { const e = p + 2 + i * 12; if (e + 12 > end) break;
      const tag = u16(e), type = u16(e + 2), cnt = u32(e + 4); const sz = ({1:1, 2:1, 3:2, 4:4, 5:8, 7:1, 9:4, 10:8})[type] || 1;
      const vp = cnt * sz <= 4 ? e + 8 : T + u32(e + 8);
      out[tag] = {type, cnt, vp}; }
    const np = p + 2 + n * 12; return {out, next: np + 4 <= end ? u32(np) : 0}; };
  const val = en => { if (!en) return null; const {type, cnt, vp} = en;
    if (type === 2) return ascii_(vp, cnt);
    if (type === 3) return u16(vp); if (type === 4) return u32(vp);
    if (type === 5) { const r = []; for (let i = 0; i < cnt; i++) { const d = u32(vp + i * 8 + 4); r.push(d ? u32(vp + i * 8) / d : 0); } return r; }
    return null; };
  const res = {dto:null, off:null, gps:null, thumb:null};
  const i0 = readIfd(T + u32(T + 4));
  if (i0.out[0x8769]) { const ex = readIfd(T + val(i0.out[0x8769])).out;
    res.dto = val(ex[0x9003]) || null; res.off = val(ex[0x9011]) || null; }
  if (!res.dto && i0.out[0x0132]) res.dto = val(i0.out[0x0132]);
  if (i0.out[0x8825]) { const g = readIfd(T + val(i0.out[0x8825])).out;
    const la = val(g[2]), lo = val(g[4]);
    if (la && lo && la.length === 3) { let lat = la[0] + la[1] / 60 + la[2] / 3600, lon = lo[0] + lo[1] / 60 + lo[2] / 3600;
      if (val(g[1]) === 'S') lat = -lat; if (val(g[3]) === 'W') lon = -lon;
      if (lat || lon) res.gps = {lat:+lat.toFixed(6), lon:+lon.toFixed(6)}; } }
  if (i0.next) { const i1 = readIfd(T + i0.next).out; const to = val(i1[0x0201]), tl = val(i1[0x0202]);
    if (to && tl && T + to + tl <= end) res.thumb = new Uint8Array(dv.buffer, dv.byteOffset + T + to, tl).slice(); }
  return res;
}
async function mp4Time(f) {
  const scan = async (start, len) => { const b = new Uint8Array(await f.slice(start, start + len).arrayBuffer());
    for (let i = 4; i < b.length - 24; i++) if (b[i] === 0x6D && b[i + 1] === 0x76 && b[i + 2] === 0x68 && b[i + 3] === 0x64) {
      const dv = new DataView(b.buffer, i + 4); const ver = dv.getUint8(0);
      const s = ver === 1 ? Number(dv.getBigUint64(4)) : dv.getUint32(4);
      if (s > 3000000000) return (s - 2082844800) * 1000; }
    return null; };
  return (await scan(0, 2 * 1048576)) || (f.size > 2 * 1048576 ? await scan(Math.max(0, f.size - 8 * 1048576), 8 * 1048576) : null);
}

    case 'start': { const g = $('#iGare').value.trim() || 'Gare', c = $('#iCode').value.trim() || 'GARE', au = $('#iAut').value.trim(); localStorage.setItem('gareoPhoto.aut', au); startVisite(g, c, au); break; }
    case 'resume': { const o = S.visites[el.dataset.id]; o.fin = null; S.current = o.id; save(); render(); showQuota(); break; }
    case 'capP': $('#capP').click(); break;
    case 'capV': $('#capV').click(); break;
    case 'imp': $('#imp').click(); break;
    case 'repSeen': S.repairV8.seen = true; save(); render(); break;
    case 'delVisite': { const o = S.visites[el.dataset.id]; if (!o) break;
      if (!confirm(`Supprimer définitivement la visite « ${o.gare} ${ymd(o.debut)} » (${o.photos.length} photos) de cet appareil ?\nLes copies dans Téléchargements et les ZIP déjà faits ne sont pas touchés.`)) break;
      const others = new Set(); Object.values(S.visites).filter(w => w !== o).forEach(w => w.photos.forEach(x => others.add(bk(x))));
      for (const x of o.photos) if (!others.has(bk(x))) { await DB.del('blobs', bk(x)).catch(() => {}); await DB.del('thumbs', bk(x)).catch(() => {}); }
      delete S.visites[o.id]; if (S.current === o.id) S.current = null; save(); render(); break; }
    case 'filtre': UI.filtre = el.dataset.v; render(); break;
    case 'openFiche': openFiche(el.dataset.id); break;
    case 'closeFiche': { if (p) commitFiche(p); closeOv(); break; }
    case 'full': { if (!p) break; const b = await DB.get('blobs', bk(p)).catch(() => null); if (!b) { toast('Fichier non disponible'); break; }
      const u = URL.createObjectURL(b); const d = document.createElement('div'); d.className = 'full';
      d.innerHTML = (p.type === 'video' ? `<video src="${u}" controls autoplay playsinline></video>` : `<img src="${u}">`) + '<button>Fermer</button>';
      d.querySelector('button').onclick = () => { URL.revokeObjectURL(u); d.remove(); }; document.body.appendChild(d); break; }
    case 'fNiv': p.niv = el.dataset.v; if (p.pt && p.pt.n !== nivOf(p.niv).plan) p.pt = null; save(); $('#fNiv').innerHTML = nivTabs(p); UI.dirMode = false; renderPlan(p); renderZoneSug(p); break;
    case 'zoom': { const w = $('#pw'), img = $('#pimg'); if (!w) break; const cx = (w.scrollLeft + w.clientWidth / 2) / img.clientWidth, cy = (w.scrollTop + w.clientHeight / 2) / img.clientHeight;
      UI.zoom = Math.max(1, Math.min(8, UI.zoom * (el.dataset.v === '1' ? 1.5 : 1 / 1.5))); UI.planDraw();
      w.scrollLeft = cx * img.clientWidth - w.clientWidth / 2; w.scrollTop = cy * img.clientHeight - w.clientHeight / 2; break; }
    case 'dirMode': UI.dirMode = !UI.dirMode; renderPlanCtl(p, nivOf(p.niv)); break;
    case 'clearPt': p.pt = null; save(); UI.dirMode = false; renderPlanCtl(p, nivOf(p.niv)); UI.planDraw(); break;
    case 'pickZone': p.zone = el.dataset.v; $('#fZone').value = p.zone; save(); renderZoneSug(p); break;
    case 'addEq': case 'addEqNew': { const n = a === 'addEq' ? el.dataset.v : UI.eqQ.trim(); if (!n) break;

    case 'clearAll': p.zone = ''; p.pt = null; p.eqs = []; p.al = []; p.ef = ''; p.star = false; save(); renderOv(); break;

  }
});
document.addEventListener('input', ev => {
